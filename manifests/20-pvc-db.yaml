apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wall-db-data
  labels:
    app.kubernetes.io/name: wall-db
    app.kubernetes.io/part-of: the-wall
spec:
  accessModes:
    - ReadWriteOnce        # hur volymen får användas
  resources:
    requests:
      storage: 1Gi         # hur mycket
      