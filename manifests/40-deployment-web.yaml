apiVersion: apps/v1
kind: Deployment
metadata:
  name: wall-web
  labels:
    app.kubernetes.io/name: wall-web
    app.kubernetes.io/part-of: the-wall
spec:
  # replicas utelämnas medvetet: HPA styr antalet (2–3)
  selector:
    matchLabels:
      app.kubernetes.io/name: wall-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wall-web
        app.kubernetes.io/part-of: the-wall
    spec:
      containers:
        - name: web
          image: quay.io/lerniadevopsdanielhormos/the-wall:1.0.0
          env:
            # Inställningar från ConfigMap (inte hemliga)
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: wall-web-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: wall-web-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: wall-web-config
                  key: DB_NAME
            # Inloggning från Secret (appkontot, aldrig admin)
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: wall-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wall-db-credentials
                  key: password
          ports:
            - containerPort: 8080
          # Startup: initialize() kan ta upp till 30 × (3 s + 2 s) = 150 s.
          # 5 s × 40 = 200 s ger marginal för det och för Gunicorns start.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 40
          # Liveness: lever processen? /health frågar inte databasen,
          # så ett databasfel orsakar ingen onödig omstart.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: fungerar databasen? GET / läser tabellen messages
          # och ger 503 vid databasfel, så Poden tas ur trafik.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2