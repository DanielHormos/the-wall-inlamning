apiVersion: apps/v1
kind: Deployment
metadata:
  name: wall-db
  labels:
    app.kubernetes.io/name: wall-db
    app.kubernetes.io/part-of: the-wall
spec:
  replicas: 1                     # en instans: PostgreSQL äger sina datafiler ensam
  strategy:
    type: Recreate                # stoppa gamla Poden först – RWO-disken får aldrig delas
  selector:
    matchLabels:
      app.kubernetes.io/name: wall-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wall-db
        app.kubernetes.io/part-of: the-wall
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60   # tid för PostgreSQL att stänga ned rent
      containers:
        - name: postgresql
          image: quay.io/kurs/postgresql:2026-10-29   # vald tagg, se README
          env:
            - name: POSTGRES_PASSWORD       # adminlösenord (superuser postgres)
              valueFrom:
                secretKeyRef:
                  name: wall-db-admin
                  key: password
            - name: POSTGRES_DB             # databasen som skapas vid första start
              value: walldb
            - name: APP_DB_USER             # läses av init-skriptet
              valueFrom:
                secretKeyRef:
                  name: wall-db-credentials
                  key: username
            - name: APP_DB_PASSWORD         # läses av init-skriptet
              valueFrom:
                secretKeyRef:
                  name: wall-db-credentials
                  key: password
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # pg_isready kräver inget lösenord: proberna påverkas inte av lösenordsbyte (C4)
          startupProbe:                     # initdb + init-skript klart, servern lyssnar
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60            # upp till 300 s
          readinessProbe:                   # tar emot anslutningar just nu
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:                    # servern hänger inte (försiktig: omstart påverkar alla)
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data       # PGDATA ligger i pgdata/ under
            - name: init
              mountPath: /docker-entrypoint-initdb.d    # där imagen letar efter init-skript
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wall-db-data
        - name: init
          configMap:
            name: wall-db-init