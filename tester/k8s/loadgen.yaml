# Begränsad lastgenerator för krav E5. Tillfällig – tas bort efter testet.
# Gör upprepade GET / mot Service wall-web (inte Route) från insidan av klustret.
apiVersion: batch/v1
kind: Job
metadata:
  name: wall-loadgen
  labels:
    app.kubernetes.io/name: wall-loadgen
    app.kubernetes.io/part-of: the-wall
spec:
  backoffLimit: 0                 # starta inte om vid fel
  activeDeadlineSeconds: 300      # hård gräns: högst 5 minuter per omgång
  ttlSecondsAfterFinished: 600    # städas bort automatiskt 10 min efter avslut
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wall-loadgen
        app.kubernetes.io/part-of: the-wall
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: registry.access.redhat.com/ubi9/ubi-minimal
          env:
            - name: CLIENTS             # samtidiga klienter (max 8)
              value: "__CLIENTS__"
            - name: DURATION            # sekunder (max 300)
              value: "__DURATION__"
          command: ["/bin/bash", "-c"]
          args:
            - |
              [ "$CLIENTS" -le 8 ] || { echo "max 8 klienter"; exit 1; }
              echo "start $(date -u +%T): $CLIENTS klienter i $DURATION s mot http://wall-web/"
              end=$((SECONDS + DURATION))
              for i in $(seq 1 "$CLIENTS"); do
                ( ok=0; fel=0
                  while [ "$SECONDS" -lt "$end" ]; do
                    code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://wall-web/)
                    if [ "$code" = "200" ]; then ok=$((ok+1)); else fel=$((fel+1)); fi
                  done
                  echo "klient $i: $ok ok, $fel fel" ) &
              done
              wait
              echo "slut $(date -u +%T)"
          resources:                    # egna gränser (E3)
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]